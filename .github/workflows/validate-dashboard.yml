name: Validate dashboard
on:
  pull_request:
  push:
    branches: ['codex/**']
permissions:
  contents: read
jobs:
  airflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the project Airflow test environment
        run: docker build --tag movie-dashboard-airflow-tests .
      - name: Check DAG wiring and RAW refresh regressions
        run: |
          docker run --rm --entrypoint python \
            -e PYTHONPATH=/opt/airflow/dags:/opt/airflow/project/scripts \
            -v "$GITHUB_WORKSPACE/dags:/opt/airflow/dags:ro" \
            -v "$GITHUB_WORKSPACE/scripts:/opt/airflow/project/scripts:ro" \
            -v "$GITHUB_WORKSPACE/tests:/dashboard-tests:ro" \
            movie-dashboard-airflow-tests \
            -m unittest discover -s /dashboard-tests -p 'test_airflow_dag.py' -v
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dashboard.txt requests==2.33.1 python-dotenv==1.2.2 pandas==3.0.2
      - name: Contract, exporter, publication and artifact tests
        run: python -m unittest discover -s tests -p 'test_dashboard_*.py' -v
      - name: Existing ingestion regression tests
        run: python -m unittest discover -s tests -p 'test_pipeline_scripts.py' -v
      - name: JavaScript syntax
        run: |
          node --check web_dashboard/js/dashboard.js
          node --check web_dashboard/js/dashboard-redesign.js
          node --check web_dashboard/js/dashboard-theme.js
      - name: Browser behavior checks
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-check" --no-save playwright@1.58.2
          "$RUNNER_TEMP/browser-check/node_modules/.bin/playwright" install --with-deps chromium
          python -m http.server 8765 --bind 127.0.0.1 --directory web_dashboard > "$RUNNER_TEMP/dashboard-http.log" 2>&1 &
          NODE_PATH="$RUNNER_TEMP/browser-check/node_modules" BASE_URL=http://127.0.0.1:8765 node tests/dashboard_browser_smoke.cjs
          NODE_PATH="$RUNNER_TEMP/browser-check/node_modules" BASE_URL=http://127.0.0.1:8765 node tests/dashboard_redesign_browser.cjs
      - name: Approved dashboard at the published site root
        run: |
          python scripts/build_dashboard_site.py --bundle tests/fixtures/dashboard/synthetic-dashboard.json --allow-synthetic --output "$RUNNER_TEMP/dashboard-site"
          python -m http.server 8767 --bind 127.0.0.1 --directory "$RUNNER_TEMP/dashboard-site" > "$RUNNER_TEMP/dashboard-public-http.log" 2>&1 &
          NODE_PATH="$RUNNER_TEMP/browser-check/node_modules" BASE_URL=http://127.0.0.1:8767 DASHBOARD_ENTRY=index.html node tests/dashboard_theme_browser.cjs
